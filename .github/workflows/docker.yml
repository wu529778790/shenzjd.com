# Docker build, push, and deploy workflow
name: Create and publish a Docker image

on:
  push:
    branches:
      - main
  # Triggered by workflow_dispatch
  workflow_dispatch:

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Always emit a `latest` tag so the deploy step can pull `:latest`.
          flavor: |
            latest=true
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see "[AUTOTITLE](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds)".
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Deploy the freshly pushed image to the production server over SSH.
  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            CONTAINER="${{ github.event.repository.name }}"
            # 站点目录定位（2026-10-27）：1Panel 升级后 OpenResty 站点根从
            #   /opt/1panel/apps/openresty/openresty/www/sites
            # 迁到 /opt/1panel/www/sites。写死旧路径的后果不是报错，而是
            # `if [ -f "$ENV_FILE" ]` 静默丢掉 --env-file → 容器空配置上线
            # （wx-auth 当天就这样挂了 20 分钟）。这里新路径优先、旧路径兜底，
            # 且把「找不到」前置到停旧容器之前：失败时老容器继续服务。
            SITE_DIR=""
            for candidate in \
              /opt/1panel/www/sites/shenzjd.com \
              /opt/1panel/apps/openresty/openresty/www/sites/shenzjd.com; do
              if [ -d "$candidate" ]; then SITE_DIR="$candidate"; break; fi
            done
            if [ -z "$SITE_DIR" ]; then
              echo "FATAL: 找不到站点目录（1Panel 站点根可能又变了），拒绝部署，旧容器未动" >&2
              exit 1
            fi
            # .env 存放约定（2026-11-11 起）：一律放 data/，不放 index/ ——
            # index/ 是 OpenResty 的对外站点根，配置文件放那里属于安全隐患。
            # 一次性迁移：老位置 index/.env 还在就挪到 data/.env，并在同一次
            # 把 SITE_URL 从裸域改为 www（裸域被全站 301 到 www，canonical
            # 指向重定向会让 Google 拒绝索引，GSC sitemap 已发现 0 条）。
            # 迁移只会发生一次：此后 index/.env 不存在，块内不再执行。
            DATA_DIR="$SITE_DIR/data"
            OLD_ENV="$SITE_DIR/index/.env"
            ENV_FILE="$SITE_DIR/data/.env"
            if [ -f "$OLD_ENV" ]; then
              sudo mv "$OLD_ENV" "$ENV_FILE"
              sudo sed -i 's#^SITE_URL=.*#SITE_URL=https://www.shenzjd.com/#' "$ENV_FILE"
              sudo chmod 600 "$ENV_FILE"
              echo "已迁移 .env：index/ → data/，SITE_URL 已改为 www"
            fi
            if [ ! -f "$ENV_FILE" ]; then
              echo "FATAL: $ENV_FILE 不存在，拒绝以空配置启动（会导致站点 500）" >&2
              exit 1
            fi
            sudo docker pull "$IMAGE"
            sudo docker stop "$CONTAINER" || true
            sudo docker rm "$CONTAINER" || true
            ENV_FLAGS="--env-file $ENV_FILE"
            sudo mkdir -p "$DATA_DIR"
            # Container USER is nodejs (uid 1001); ensure it can write the
            # persistent X feed (and any future on-disk state) here.
            sudo chown -R 1001:1001 "$DATA_DIR"
            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --memory=512m \
              --memory-swap=768m \
              --cpus=1.0 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              -e NODE_OPTIONS="--max-old-space-size=256" \
              $ENV_FLAGS \
              -e NAVS= \
              -v "$DATA_DIR:/app/data" \
              -p 6669:4321 \
              "$IMAGE"
            sudo docker image prune -f
            # 部署后自检：环境变量是否如预期注入、页面实际输出什么。
            # （曾出现「迁移日志正常但站点仍输出旧域名」的情况，自检可以直接定位）
            sleep 3
            echo "=== 部署后自检 ==="
            echo "-- $ENV_FILE 中含 SITE_URL 的行（含行号，警惕重复/带空格的行）:"
            sudo grep -n "SITE_URL" "$ENV_FILE" || echo "  (文件里没有 SITE_URL 行)"
            echo "-- index/ 下是否还残留 .env:"
            ls -la "$SITE_DIR/index/" | grep -F ".env" || echo "  (index/ 已无 .env，迁移干净)"
            echo "-- 容器实际环境变量:"
            sudo docker exec "$CONTAINER" env | grep -E "^(SITE_URL|NODE_ENV|DOCKER)" || echo "  (容器里没有 SITE_URL)"
            echo "-- 容器端口直出的 canonical（绕过 OpenResty/CDN）:"
            curl -s --max-time 10 http://127.0.0.1:6669/ | grep -oE '<link rel="canonical"[^>]*>' | head -1 || echo "  (curl 本地失败)"
